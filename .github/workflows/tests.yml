name: Offline validation — no TWS connectivity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline test dependencies
        run: python -m pip install "pandas>=2.1,<3" "pytest>=8,<10" "tzdata>=2024.1"
      - name: Check original Python modules and notebook
        run: |
          python -m compileall -q ibkr_history_core.py ibkr_backfill_watchdog.py ibkr_backfill_audit.py
          python -c "import json; n=json.load(open('IBKR_NQ_ES_1min_Backfill.ipynb',encoding='utf-8')); assert n['nbformat']==4"
      - name: Run offline tests
        run: python -m pytest -q
