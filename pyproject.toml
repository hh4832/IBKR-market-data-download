[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibkr-market-data-download"
version = "1.5.0"
description = "Windows-local IBKR TWS 1-minute historical downloader with checkpoint and offline diagnostics"
requires-python = ">=3.11"
dependencies = [
  "ib_async>=2.1,<3",
  "pandas>=2.1,<3",
  "pyarrow>=15,<25",
  "tqdm>=4.66,<5",
  "ipython>=8,<10",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
notebook = ["ipykernel>=6,<8", "notebook>=7,<8", "ipywidgets>=8,<9"]
dev = ["pytest>=8,<10"]

[tool.setuptools]
py-modules = ["ibkr_history_core", "ibkr_backfill_watchdog", "ibkr_backfill_audit", "ibkr_window_quality", "ibkr_history_recovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
